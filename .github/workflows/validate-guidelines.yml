name: Validate Guidelines
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate rules drift
        run: node guidelines/global-configs/scripts/audit-rules.js
      - name: Validate internal links
        run: node guidelines/global-configs/scripts/check-links.js
      - name: Validate index coverage
        run: node guidelines/global-configs/scripts/check-index-coverage.js
